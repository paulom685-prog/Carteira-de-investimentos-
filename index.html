<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteira Pro</title>
    <style>
        :root { --primary: #2563eb; --danger: #ef4444; --success: #10b981; --bg: #f8fafc; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); padding: 15px; margin: 0; }
        .app-container { max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { font-size: 1.25rem; margin-bottom: 15px; color: #1e293b; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; font-size: 12px; color: #64748b; padding: 10px; }
        td { padding: 12px 10px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .btn-del { color: var(--danger); background: none; border: none; font-size: 18px; cursor: pointer; }
        .resumo-card { display: flex; justify-content: space-between; background: #1e293b; color: white; padding: 15px; border-radius: 12px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="card">
        <h2>Adicionar Ativo</h2>
        <select id="tipo">
            <option value="Ação/FII">Ação / FII</option>
            <option value="Crypto">Criptomoeda</option>
        </select>
        <input type="text" id="nome" placeholder="Ativo (Ex: PETR4 ou BTC)">
        <input type="number" id="qtd" placeholder="Quantidade">
        <input type="number" id="preco" placeholder="Preço Médio (R$)">
        <input type="number" id="extra" placeholder="Div. Anual ou Preço Atual">
        <button onclick="adicionar()">Adicionar à Carteira</button>
    </div>

    <div class="resumo-card">
        <div>Total: R$ <span id="totalInvest">0.00</span></div>
        <div>Divs: R$ <span id="totalDivs">0.00</span></div>
    </div>

    <div class="card table-wrap">
        <table>
            <thead><tr><th>Ativo</th><th>Qtd</th><th>Invest.</th><th>Result</th><th></th></tr></thead>
            <tbody id="lista"></tbody>
        </table>
    </div>
</div>

<script>
    let carteira = JSON.parse(localStorage.getItem('minhaCarteira')) || [];

    function salvarEAtualizar() {
        localStorage.setItem('minhaCarteira', JSON.stringify(carteira));
        renderizar();
    }

    function adicionar() {
        let obj = {
            id: Date.now(),
            tipo: document.getElementById('tipo').value,
            nome: document.getElementById('nome').value.toUpperCase(),
            qtd: parseFloat(document.getElementById('qtd').value),
            preco: parseFloat(document.getElementById('preco').value),
            extra: parseFloat(document.getElementById('extra').value) || 0
        };

        if(!obj.nome || isNaN(obj.qtd) || isNaN(obj.preco)) return alert("Preencha corretamente!");
        
        carteira.push(obj);
        salvarEAtualizar();
    }

    function remover(id) {
        carteira = carteira.filter(item => item.id !== id);
        salvarEAtualizar();
    }

    function renderizar() {
        let tbody = document.getElementById('lista');
        tbody.innerHTML = '';
        let invTotal = 0, divTotal = 0;

        carteira.forEach(item => {
            let investido = item.qtd * item.preco;
            invTotal += investido;
            
            let resultado = "";
            if(item.tipo === 'Ação/FII') {
                let dy = (item.extra / item.preco) * 100;
                resultado = dy.toFixed(1) + "% DY";
                divTotal += (item.qtd * item.extra);
            } else {
                let lucro = (item.extra - item.preco) * item.qtd;
                resultado = "R$ " + lucro.toFixed(0);
            }

            tbody.innerHTML += `<tr>
                <td>${item.nome}<br><small style="color:gray">${item.tipo}</small></td>
                <td>${item.qtd}</td>
                <td>R$ ${investido.toFixed(0)}</td>
                <td>${resultado}</td>
                <td><button class="btn-del" onclick="remover(${item.id})">×</button></td>
            </tr>`;
        });

        document.getElementById('totalInvest').innerText = invTotal.toFixed(2);
        document.getElementById('totalDivs').innerText = divTotal.toFixed(2);
    }

    renderizar();
</script>
</body>
</html>
